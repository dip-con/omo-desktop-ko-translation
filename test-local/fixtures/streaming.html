<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>streaming message (test fixture, not the app)</title>
<script>
window.__lt = [];
// The long text is a dictionary entry of 200 to 300 characters, so every chunk's long node is written by the translator.
var LONG = "Where a browser an agent opens appears, unless the agent says otherwise. Closing the panel on it keeps the panel closed for that thread until the agent opens a new tab. A device an agent opens floats, or opens as a panel tab with Don't show.";
new PerformanceObserver(function (list) {
  list.getEntries().forEach(function (e) { window.__lt.push({ start: e.startTime, duration: e.duration }); });
}).observe({ type: 'longtask', buffered: true });
// The test calls __startStream after it has subscribed to stream-done, so no stream is missed.
window.__startStream = function () {
  var chunk = 0;
  function step() {
    var stream = document.getElementById('stream');
    for (var i = 0; i < 100; i += 1) {
      var d = document.createElement('div');
      d.textContent = i === 7 ? LONG : (i % 2 === 0 ? 'Settings' : 'Cancel');
      stream.appendChild(d);
    }
    chunk += 1;
    if (chunk < 20) setTimeout(step, 0);
    else window.dispatchEvent(new Event('stream-done'));
  }
  setTimeout(step, 0);
};
</script>
</head>
<body>
<div id="root"><div id="stream"></div></div>
</body>
</html>
